name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile and import without a Discord token
        run: python scripts/check_imports.py
        env:
          DISCORD_TOKEN: ""

      - name: Top-level slash command count
        run: python scripts/check_slash_budget.py
        env:
          DISCORD_TOKEN: ""

      - name: Slash command payload size
        run: python scripts/check_command_payload.py
        env:
          DISCORD_TOKEN: ""

      - name: Explore kill points share the daily cap
        run: python scripts/test_explore_kill_points.py
        env:
          DISCORD_TOKEN: ""

      - name: Explore two-person fights resolve on the second cast
        run: python scripts/test_explore_pack_timer.py
        env:
          DISCORD_TOKEN: ""

      - name: Found secrets are listed and a repeat phrase reacts
        run: python scripts/test_secrets_found.py
        env:
          DISCORD_TOKEN: ""

      - name: Duel Night pool payout
        run: python scripts/test_duel_night.py
        env:
          DISCORD_TOKEN: ""

      - name: Every set won is credited
        run: python scripts/test_duel_set_credit.py
        env:
          DISCORD_TOKEN: ""

      - name: Daily Descent challenge is 75 floor-40+ monsters
        run: python scripts/test_bind40_goal.py
        env:
          DISCORD_TOKEN: ""

      - name: Broke ticket webhook forward
        run: python scripts/test_broke_webhook.py
        env:
          DISCORD_TOKEN: ""

      - name: Curse and Crown rules
        run: python scripts/test_vcc_rules.py
        env:
          DISCORD_TOKEN: ""

      - name: Practice drills award nothing
        run: python scripts/test_practice_modes.py
        env:
          DISCORD_TOKEN: ""

      - name: Practice drills skip challenges and quests
        run: python scripts/test_practice_progress.py
        env:
          DISCORD_TOKEN: ""

      - name: Spell clicks answer before slow edits
        run: python scripts/test_threat_interaction_ack.py
        env:
          DISCORD_TOKEN: ""
